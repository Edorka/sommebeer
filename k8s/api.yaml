apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels: { app: api }
spec:
  replicas: 1
  selector: { matchLabels: { app: api } }
  template:
    metadata: { labels: { app: api } }
    spec:
      containers:
        - name: api
          # built with: podman build -f api/Dockerfile -t <registry>/sommebeer-api:tag .
          image: sommebeer-api:local
          imagePullPolicy: IfNotPresent
          ports: [ { containerPort: 8000 } ]
          env:
            # The LLM is an external provider — no model server is deployed in the cluster.
            # Set provider here and the key via a Secret (use SOMMEBEER_LLM__DI_API_KEY for
            # deepinfra, or replace with GCP_PROJECT/GCP_LOCATION for vertex).
            - { name: SOMMEBEER_LLM__PROVIDER,      value: deepinfra }
            - { name: SOMMEBEER_LLM__API_KEY,       valueFrom: { secretKeyRef: { name: sommebeer-llm, key: apiKey } } }
            - { name: SOMMEBEER_LLM__TEMPERATURE,   value: "0.3" }
            - { name: SOMMEBEER_WEAVIATE__HOST,     value: weaviate }
            - { name: SOMMEBEER_WEAVIATE__PORT,     value: "8080" }
            - { name: SOMMEBEER_WEAVIATE__GRPC_PORT, value: "50051" }
            - { name: SOMMEBEER_PHOENIX__ENABLED,   value: "false" } # enable + point at a Phoenix service if you deploy one
            - { name: SOMMEBEER_API__ENVIRONMENT,   value: production }
            # pydantic-settings parses list fields as JSON
            - { name: SOMMEBEER_API__CORS_ORIGINS,  value: '["http://frontend.example"]' }
          resources:
            requests: { memory: 512Mi, cpu: 250m }
            limits: { memory: 1Gi, cpu: "1" }
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 15
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata: { name: api }
spec:
  selector: { app: api }
  ports:
    - { name: http, port: 80, targetPort: 8000 }
---
# SOMMEBEER_LLM__DI_API_KEY (or the GCP project/location equivalents).
# Create before the first deploy: kubectl create secret generic sommebeer-llm --from-literal=apiKey=...
apiVersion: v1
kind: Secret
metadata: { name: sommebeer-llm }
type: Opaque
stringData:
  apiKey: REPLACE_ME
