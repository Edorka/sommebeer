# Network isolation — weaviate reachable only from api, api only from web,
# web only from the ingress. Applies only to ingress; egress stays open
# (api talks to DeepInfra over the internet, DNS everywhere).
# Note: NetworkPolicy pod ports match TARGET ports (weaviate 8080/50051,
# api 8000, web 8080), not Service ports.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  namespace: sommebeer
  name: weaviate-only-from-api
spec:
  podSelector: { matchLabels: { app: weaviate } }
  policyTypes: [ Ingress ]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: api } }
        - podSelector: { matchLabels: { app: seed } }
      ports:
        - { port: 8080, protocol: TCP }
        - { port: 50051, protocol: TCP }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  namespace: sommebeer
  name: api-only-from-web
spec:
  podSelector: { matchLabels: { app: api } }
  policyTypes: [ Ingress ]
  ingress:
    - from: [ { podSelector: { matchLabels: { app: web } } } ]
      ports: [ { port: 8000, protocol: TCP } ]
  # kubelet health probes are not affected: they come from the node itself
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  namespace: sommebeer
  name: web-only-from-ingress
spec:
  podSelector: { matchLabels: { app: web } }
  policyTypes: [ Ingress ]
  ingress:
    # k3s's bundled Traefik lives in kube-system
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
          podSelector: { matchLabels: { app.kubernetes.io/name: traefik } }
      ports: [ { port: 8080, protocol: TCP } ]
