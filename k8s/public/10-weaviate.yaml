# Weaviate — Beer collection store. Anonymous access; only the api pod may
# reach it (see 60-netpol.yaml). Data on a 2 Gi LOCAL_SSD PVC.
apiVersion: v1
kind: Service
metadata:
  namespace: sommebeer
  name: weaviate
  labels: { app: weaviate }
spec:
  selector: { app: weaviate }
  ports:
    - { name: http, port: 8080, targetPort: 8080 }
    - { name: grpc, port: 50051, targetPort: 50051 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  namespace: sommebeer
  name: weaviate
  labels: { app: weaviate }
spec:
  serviceName: weaviate
  replicas: 1
  selector: { matchLabels: { app: weaviate } }
  template:
    metadata: { labels: { app: weaviate } }
    spec:
      containers:
        - name: weaviate
          image: semitechnologies/weaviate:1.33.0
          ports:
            - { containerPort: 8080 }
            - { containerPort: 50051 }
          # size/scale env as in beertor/docker-compose.yml — vectors are
          # client-provided, no text vectorizer modules needed
          env:
            - { name: QUERY_DEFAULTS_LIMIT,  value: "25" }
            - { name: AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED, value: "true" }
            - { name: PERSISTENCE_DATA_PATH, value: /var/lib/weaviate }
            - { name: DEFAULT_VECTORIZER_MODULE, value: none }
            - { name: ENABLE_MODULES,        value: "" }
            - { name: CLUSTER_HOSTNAME,      value: node1 }
          resources:
            requests: { memory: 512Mi, cpu: 200m }
            limits:   { memory: 2Gi,   cpu: "1" }
          readinessProbe:
            httpGet: { path: /v1/.well-known/ready, port: 8080 }
          livenessProbe:
            httpGet: { path: /v1/.well-known/live, port: 8080 }
          volumeMounts:
            - { name: weaviate-data, mountPath: /var/lib/weaviate }
  volumeClaimTemplates:
    - metadata: { name: weaviate-data }
      spec:
        accessModes: [ ReadWriteOnce ]
        resources: { requests: { storage: 2Gi } }
