# sommebeer HTTP API — slim image (no Phoenix/Vertex; tracing fails soft).
# SOMMEBEER_LLM__DI_API_KEY comes from the pre-existing sommebeer-llm Secret.
apiVersion: v1
kind: Service
metadata:
  namespace: sommebeer
  name: api
  labels: { app: api }
spec:
  selector: { app: api }
  ports:
    - { name: http, port: 80, targetPort: 8000 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: sommebeer
  name: api
  labels: { app: api }
spec:
  replicas: 1
  selector: { matchLabels: { app: api } }
  template:
    metadata: { labels: { app: api } }
    spec:
      imagePullSecrets:
        - { name: ghcr-pull }
      containers:
        - name: api
          image: ghcr.io/edorka/sommebeer-api:v0.1.9-slim
          imagePullPolicy: IfNotPresent
          ports: [ { containerPort: 8000 } ]
          env:
            - { name: SOMMEBEER_LLM__PROVIDER, value: deepinfra }
            - name: SOMMEBEER_LLM__DI_API_KEY
              valueFrom: { secretKeyRef: { name: sommebeer-llm, key: apiKey } }
            - { name: SOMMEBEER_LLM__DI_MODEL, value: Qwen/Qwen3-14B }
            - { name: SOMMEBEER_LLM__TEMPERATURE, value: "0.3" }
            - { name: SOMMEBEER_WEAVIATE__HOST,     value: weaviate }
            - { name: SOMMEBEER_WEAVIATE__PORT,     value: "8080" }
            - { name: SOMMEBEER_WEAVIATE__GRPC_PORT, value: "50051" }
            - { name: SOMMEBEER_PHOENIX__ENDPOINT,  value: http://phoenix:6006 }
            - { name: SOMMEBEER_PHOENIX__ENABLED,   value: "true" }
            - { name: SOMMEBEER_API__ENVIRONMENT,   value: production }
            # No CORS needed: the browser only talks to the web pod, which
            # reverse-proxies /chat and /health same-origin.
          resources:
            requests: { memory: 512Mi, cpu: 250m }
            limits:   { memory: 1Gi,   cpu: "1" }
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 4    # /health does external TCP checks (LLM, Weaviate)
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 15
            timeoutSeconds: 4
