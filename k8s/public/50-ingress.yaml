# The only public entry point: sommebeer.ai.abscin.de -> web with TLS.
# letsencrypt (ClusterIssuer, see 50-clusterissuer.yaml) via HTTP-01:
# Traefik terminates 443 and serves the cert-managed certificate.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  namespace: sommebeer
  name: web
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: traefik
  rules:
    - host: sommebeer.ai.abscin.de
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port: { number: 80 }
  tls:
    - hosts: [ sommebeer.ai.abscin.de ]
      secretName: sommebeer-web-tls
