# Static web UI (nginx) reverse-proxying /chat and /health to the api Service
# same-origin — the browser's only origin; no CORS anywhere.
apiVersion: v1
kind: Service
metadata:
  namespace: sommebeer
  name: web
  labels: { app: web }
spec:
  selector: { app: web }
  ports:
    - { name: http, port: 80, targetPort: 8080 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: sommebeer
  name: web
  labels: { app: web }
spec:
  replicas: 1
  selector: { matchLabels: { app: web } }
  template:
    metadata: { labels: { app: web } }
    spec:
      imagePullSecrets:
        - { name: ghcr-pull }
      containers:
        - name: web
          image: ghcr.io/edorka/sommebeer-web:v0.1.6
          imagePullPolicy: IfNotPresent
          ports: [ { containerPort: 8080 } ]
          resources:
            requests: { memory: 32Mi, cpu: 50m }
            limits:   { memory: 128Mi, cpu: 250m }
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: 8080 }
            periodSeconds: 15
            timeoutSeconds: 3
