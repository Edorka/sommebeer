# Sommebeer web UI — small static site, no server-side logic
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml;

    # hashed assets: cache hard
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # reverse-proxied API — same-origin, so the browser needs no CORS anywhere
    location = /chat     { proxy_pass http://api:80/chat;     proxy_set_header Host $host; }
    location = /health   { proxy_pass http://api:80/health;   proxy_set_header Host $host; }
    location = /feedback { proxy_pass http://api:80/feedback; proxy_set_header Host $host; }

    location / {
        try_files $uri /index.html;
    }
}
